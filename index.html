<!DOCTYPE html>
<html>

<head>
    <title>Icanio Tech School</title>
    <link rel="stylesheet" href="style.css">
</head>

</html>

<body>
    <div class="container">
        <div class="left">
            <img src="image.jpg" alt="Icanio Image">
        </div>
        <div class="right">
            <div class="content">
                <img id="logo" src="image.png" alt="Icanio Logo">
                <div class="login">
                    <h2>Login</h2>
                </div>
                <div class="access">
                    <p>Access your account</p>
                </div>
                <div class="input-box">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" placeholder="Enter your password">
                </div>
                <div class="input-box">
                    <label for="Password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                <div class="login-container">

                    <a href="#" class="forgot">Forget Password?</a>

                    <button class="login-btn">Login</button>

                    <p class="or">or</p>
                    <p class="continue">Continue with</p>

                  
                    <div class="social-buttons">
                        <button class="social google" aria-label="Google login">
                            <img src="google.jpg" alt="Google">
                        </button>

                        <button class="social apple" aria-label="Apple login">
                            <img src="apple.jpg" alt="Apple">
                        </button>
                    </div>

                    <p class="signup">Don't you have an account? <a href="#">Sign Up</a></p>

                </div>

            </div>
        </div>
    </div>
    </div>
</body>
